<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat widget demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 48px; color: #222; }
      h1 { font-weight: 600; }
      p { max-width: 520px; color: #555; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Storefront mockup</h1>
    <p>
      This page simulates a BigCommerce storefront. The chat widget loads from
      the same <code>&lt;script&gt;</code> snippet you'd paste into Script
      Manager. Make sure the server is running on <code>localhost:3000</code>
      and that <code>ALLOWED_ORIGINS</code> includes this dev origin
      (<code>http://localhost:8080</code>).
    </p>

    <!-- The Script Manager snippet (points at the local dev server) -->
    <script
      src="/dist/widget.js"
      data-api="http://localhost:3000"
      data-color="#2d6cdf"
      data-title="Chat with us"
      data-greeting="Hi! 👋 Ask me about products, your order, or our policies."
      defer
    ></script>
  </body>
</html>
